services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: afflix
      POSTGRES_PASSWORD: afflix_local_only
      POSTGRES_DB: afflix
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afflix -d afflix']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
